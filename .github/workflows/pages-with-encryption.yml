name: Deploy Jekyll site to Pages with Password Protection

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        run: bundle install
      
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      
      - name: Install PageCrypt
        run: npm install -g pagecrypt@5.1.0
      
      - name: Add custom CSS to pages before encryption
        run: |
          if [ -f "_protected_pages.txt" ]; then
            while IFS=' ' read -r filename password || [ -n "$filename" ]; do
              if [ -f "_site/$filename" ]; then
                echo "Adding custom CSS to $filename..."
                # Add CSS to hide PageCrypt branding before encryption
                sed -i '/<\/head>/i\
                <style>\
                a[href*="pagecrypt"] { display: none !important; }\
                a[href*="github.com/MaxLaumeister/PageCrypt"] { display: none !important; }\
                main > a:last-child { display: none !important; }\
                </style>' "_site/$filename"
              fi
            done < "_protected_pages.txt"
          fi

      - name: Encrypt protected pages
        run: |
          if [ -f "_protected_pages.txt" ]; then
            while IFS=' ' read -r filename password || [ -n "$filename" ]; do
              if [ -f "_site/$filename" ]; then
                echo "Encrypting $filename with password protection..."
                pagecrypt "_site/$filename" "_site/$filename" "$password" --no-banner
              else
                echo "Warning: $filename not found in _site directory"
              fi
            done < "_protected_pages.txt"
          else
            echo "No _protected_pages.txt file found"
          fi

      - name: Remove PageCrypt branding after encryption
        run: |
          if [ -f "_protected_pages.txt" ]; then
            while IFS=' ' read -r filename password || [ -n "$filename" ]; do
              if [ -f "_site/$filename" ]; then
                echo "Removing PageCrypt branding from $filename..."
                # Remove PageCrypt branding links
                sed -i 's/<a[^>]*github\.com\/MaxLaumeister\/PageCrypt[^>]*>.*<\/a>//g' "_site/$filename"
                sed -i 's/<a[^>]*pagecrypt[^>]*>.*<\/a>//g' "_site/$filename"
                # Remove any standalone PageCrypt text/links at the end
                sed -i 's/Created with.*PageCrypt.*//g' "_site/$filename"
              fi
            done < "_protected_pages.txt"
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4